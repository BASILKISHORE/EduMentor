<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduMentor - Your Learning Companion</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-6">
        <h1 class="text-4xl font-bold text-blue-600 mb-6">EduMentor</h1>
        <p class="text-lg mb-4">Get personalized study plans and resources to ace your studies!</p>
        <div class="bg-white p-6 rounded-lg shadow-md">
            <input id="userId" type="text" placeholder="Enter your User ID" class="border p-3 w-full mb-4 rounded">
            <input id="query" type="text" placeholder="What do you want to learn? (e.g., Study for physics)" class="border p-3 w-full mb-4 rounded">
            <button onclick="submitQuery()" class="bg-blue-500 text-white p-3 rounded hover:bg-blue-600 w-full">Get Study Plan</button>
        </div>
        <div id="response" class="mt-6 bg-white p-6 rounded-lg shadow-md hidden"></div>
    </div>
    <script>
        async function submitQuery() {
            const userId = document.getElementById("userId").value || "default_user";
            const query = document.getElementById("query").value;
            if (!query) {
                alert("Please enter a query!");
                return;
            }
            try {
                const response = await fetch("/query", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: userId, query })
                });
                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error);
                }
                const responseDiv = document.getElementById("response");
                responseDiv.classList.remove("hidden");
                responseDiv.innerHTML = `
                    <h2 class="text-2xl font-semibold mb-2">Your Study Plan</h2>
                    <p class="mb-4">${data.study_plan}</p>
                    <h2 class="text-2xl font-semibold mb-2">Resources</h2>
                    <ul class="list-disc pl-5 mb-4">${data.content.map(item => `<li>${item}</li>`).join("")}</ul>
                    <h2 class="text-2xl font-semibold mb-2">Keep Going!</h2>
                    <p>${data.motivation}</p>
                `;
            } catch (error) {
                document.getElementById("response").innerHTML = `<p class="text-red-500">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
